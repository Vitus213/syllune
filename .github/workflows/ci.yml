name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rust tests and flake checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Cargo fmt
        run: nix develop -c cargo fmt --check

      - name: Cargo tests
        run: nix develop -c cargo test --all-targets

      - name: Flake check
        run: nix flake check -L
