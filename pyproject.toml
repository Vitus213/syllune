[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "type4me-linux"
version = "0.1.0"
description = "受 Type4Me 启发、通过 Nix 打包的 Linux 语音输入应用。"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "type4me-linux 贡献者" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pre-commit"]

[project.scripts]
type4me-linux = "type4me_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=type4me_linux --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: 使用伪造外部命令的 CLI 集成测试",
    "e2e: 使用伪造 Linux 外部工具的端到端 CLI 流程测试",
    "real_asr: 使用已安装模型的可选真实 ASR 冒烟测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/type4me_linux/desktop.py" = ["E402"]
"tests/test_desktop_view.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["type4me_linux"]

[tool.coverage.report]
show_missing = true
skip_covered = false
