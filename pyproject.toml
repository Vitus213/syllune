[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "type4me-linux"
version = "0.1.0"
description = "Linux voice input pipeline inspired by Type4Me, packaged with Nix."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "type4me-linux contributors" }]
dependencies = []

[project.scripts]
type4me-linux = "type4me_linux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

