repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format-check
        name: ruff format check
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pytest
        name: pytest with coverage
        entry: nix develop -c python -m pytest
        language: system
        pass_filenames: false
